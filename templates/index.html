<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkySense AI - Professional Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b1329; background-image: radial-gradient(circle at 50% 0%, #172554 0%, #0b1329 70%); color: #ffffff; min-height: 100vh; padding: 20px 40px; }

        /* Loading Spinner */
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast Notification */
        .toast { visibility: hidden; min-width: 250px; background-color: #ef4444; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 9999; bottom: 30px; left: 50%; transform: translateX(-50%); }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 15px; margin-bottom: 25px; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; cursor: pointer; }
        .logo-area span { color: #3b82f6; }
        .nav-links { display: flex; gap: 30px; font-size: 0.9rem; color: #94a3b8; }
        .nav-links div { cursor: pointer; padding-bottom: 17px; transition: color 0.2s; }
        .nav-links div:hover { color: #ffffff; }
        .nav-links .active { color: #ffffff; font-weight: 500; border-bottom: 2px solid #3b82f6; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .location-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 9px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .location-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .search-bar-wrapper { position: relative; width: 260px; }
        .search-bar-wrapper input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 15px 10px 35px; border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
        .search-icon { position: absolute; left: 12px; top: 12px; color: #64748b; width: 14px; height: 14px; }
        
        .suggestions-box { position: absolute; top: 100%; left: 0; width: 100%; background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; margin-top: 5px; z-index: 2000; display: none; }
        .suggestion-item { padding: 12px 15px; cursor: pointer; font-size: 0.85rem; color: #cbd5e1; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .suggestion-item:hover { background: rgba(59, 130, 246, 0.2); }

        .view-section { display: none; }
        .view-section.active-view { display: block; }

        /* Responsive Layout */
        .dashboard-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; max-width: 1300px; margin: 0 auto; transition: opacity 0.3s; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } body { padding: 10px; } }
        
        .card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 24px; }
        .location-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .main-temp-display { display: flex; align-items: baseline; gap: 15px; margin: 15px 0; }
        .temp-value { font-size: 4.5rem; font-weight: 300; }
        
        .micro-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 25px; }
        .stat-pill { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 12px; text-align: center; }
        
        .rain-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .rain-slot { background: rgba(255, 255, 255, 0.02); padding: 10px; border-radius: 10px; text-align: center; }
        
        /* Chatbot Widget */
        .chat-widget { position: fixed; bottom: 25px; right: 25px; z-index: 1000; }
        .chat-btn { background: #3b82f6; border-radius: 50%; width: 65px; height: 65px; cursor: pointer; border: none; color: white; font-size: 28px; }
        .chat-window { display: none; width: 350px; height: 450px; background: rgba(17, 24, 39, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; flex-direction: column; margin-bottom: 15px; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; font-size: 0.9rem; }
        .msg.user { background: #3b82f6; align-self: flex-end; }
        .msg.ai { background: rgba(255, 255, 255, 0.1); align-self: flex-start; }
        .chat-input-area { padding: 15px; background: rgba(0,0,0,0.2); display: flex; gap: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="switchTab('dashboard')">☀️ SkySense <span>AI</span></div>
        <div class="header-right">
            <button class="location-btn" onclick="detectUserLocation()">📍 Use My Location</button>
            <div class="search-bar-wrapper">
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
                <div id="suggestionsBox" class="suggestions-box"></div>
            </div>
        </div>
    </header>

    <div id="loading-spinner" class="spinner"></div>
    <div id="toast" class="toast"></div>

    <div id="view-dashboard" class="view-section active-view">
        <div class="dashboard-grid">
            <div>
                <div class="card">
                    <div class="location-title" id="locationDisplay">📍 Detecting Location...</div>
                    <div class="main-temp-display">
                        <div class="temp-value" id="tempDisplay">--°</div>
                        <div id="descDisplay">--</div>
                    </div>
                </div>
            </div>
            <div>
                <div class="card">
                    <div class="section-header">🌧️ Hourly Rain Probability</div>
                    <div class="rain-timeline" id="rainTimelineContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-widget">
        <div class="chat-window" id="chatWindow">
            <div class="chat-messages" id="chatMessages">
                <div class="msg ai">Hello! Ask me: "What should I do today?"</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask me...">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
        <button class="chat-btn" onclick="toggleChat()">💬</button>
    </div>

    <script>
        function toggleLoading(show) {
            document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
            document.getElementById('view-dashboard').style.opacity = show ? '0.5' : '1';
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function getWeatherByCoords(lat, lon, displayName) {
            toggleLoading(true);
            try {
                const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}&city=${encodeURIComponent(displayName)}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                updateDashboard(data);
            } catch (err) {
                showToast(err.message);
            } finally {
                toggleLoading(false);
            }
        }

        function toggleChat() {
            const chatWin = document.getElementById('chatWindow');
            chatWin.style.display = chatWin.style.display === 'flex' ? 'none' : 'flex';
        }

        // Add the rest of your updateDashboard and location logic here
        window.onload = () => detectUserLocation();
    </script>
</body>
</html>
